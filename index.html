<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameBoy Emulator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 20px;
            background-color: #f5f5f5;
        }
        .gameboy-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            background-color: #ddd;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
        }
        canvas {
            background-color: #9bbc0f;
            margin-bottom: 20px;
            image-rendering: pixelated;
        }
        .controls {
            margin-bottom: 15px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }
        button {
            padding: 8px 15px;
            background-color: #555;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #777;
        }
        .status-container {
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .hide {
            display: none;
        }
        input[type="file"] {
            margin-bottom: 10px;
        }
        #error {
            color: red;
            margin-top: 10px;
            padding: 10px;
            background-color: #ffecec;
            border: 1px solid #f5aca6;
            border-radius: 5px;
        }
        .instructions {
            margin-top: 20px;
            padding: 10px;
            background-color: #e8f4f8;
            border-radius: 5px;
            max-width: 500px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="gameboy-container">
        <h1>GameBoy Emulator</h1>
        
        <canvas id="screen" width="160" height="144"></canvas>
        
        <div class="controls">
            <input type="file" id="file" accept=".gb,.gbc">
            <button id="pause-btn">Pause</button>
            <button id="sound-btn">Enable Sound</button>
        </div>
        
        <div class="status-container">
            <div id="status">Ready</div>
            <div id="game-name"></div>
            <div id="error" class="hide"></div>
        </div>
        
        <div class="instructions">
            <h3>Controls:</h3>
            <p>Arrow keys: D-pad | G: A button | B: B button</p>
            <p>H: Start | N: Select</p>
        </div>
    </div>
    
    <script src="gameboy.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Initialize the GameBoy emulator
            const canvas = document.getElementById('screen');
            const gameboy = new GameboyJS.Gameboy(canvas, {
                zoom: 2,
                pad: {
                    class: GameboyJS.Keyboard
                }
            });
            
            // Function to load a boot ROM
            function loadBootROM() {
                loadboot(gameboy.cpu);
                gameboy.cpu.usingBootRom = true;
                gameboy.cpu.run();
            }
            
            // Load the boot ROM immediately
            loadBootROM();
            
            // Handle pause button
            const pauseBtn = document.getElementById('pause-btn');
            let isPaused = false;
            
            pauseBtn.addEventListener('click', function() {
                isPaused = !isPaused;
                gameboy.pause(isPaused);
                pauseBtn.textContent = isPaused ? 'Resume' : 'Pause';
            });
            
            // Handle sound button
            const soundBtn = document.getElementById('sound-btn');
            let soundEnabled = false;
            
            soundBtn.addEventListener('click', function() {
                soundEnabled = !soundEnabled;
                gameboy.setSoundEnabled(soundEnabled);
                soundBtn.textContent = soundEnabled ? 'Disable Sound' : 'Enable Sound';
            });
            
            // Enable drag and drop for ROM files
            canvas.addEventListener('dragover', function(e) {
                e.preventDefault();
                e.stopPropagation();
                canvas.style.opacity = 0.7;
            });
            
            canvas.addEventListener('dragleave', function(e) {
                e.preventDefault();
                e.stopPropagation();
                canvas.style.opacity = 1.0;
            });
            
            canvas.addEventListener('drop', function(e) {
                e.preventDefault();
                e.stopPropagation();
                canvas.style.opacity = 1.0;
                
                if (e.dataTransfer.files.length > 0) {
                    const file = e.dataTransfer.files[0];
                    if (file.name.endsWith('.gb') || file.name.endsWith('.gbc')) {
                        const reader = new FileReader();
                        reader.onload = function(e) {
                            const rom = new Uint8Array(e.target.result);
                            gameboy.cpu.reset();
                            gameboy.cpu.loadRom(rom);
                            gameboy.setStatus('Game Running:');
                            gameboy.setGameName(gameboy.cpu.getGameName());
                            gameboy.cpu.run();
                        };
                        reader.readAsArrayBuffer(file);
                    }
                }
            });
        });
    </script>

</body>
</html>
